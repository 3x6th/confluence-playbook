---
- name: Install Docker and run Confluence stack
  hosts: localhost
  become: true
  gather_facts: true

  vars:
    vault_addr: "http://77.221.140.212:8201"
    vault_mount_point: "secret"
    vault_path: "confluence"
    project_dir: "{{ playbook_dir }}"   # contains confluence-compose.yml and variables.env.j2

  vars_files:
    - secret_vault_token.yml            # contains: vaultToken: !vault | ...

  pre_tasks:
    - name: Ensure keyring dir exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

  tasks:
    - name: Ensure Docker service is started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Getting HashiCorp secrets (KV v2)
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        engine_mount_point: "{{ vault_mount_point }}"
        path: "{{ vault_path }}"
        token: "{{ vaultToken }}"          # from secret_vault_token.yml
      register: vault_secrets

    - name: Create env file for compose from template
      ansible.builtin.template:
        src: variables.env.j2
        dest: "{{ project_dir }}/variables.env"
        mode: "0600"
      vars:
        secret: "{{ vault_secrets.secret.data }}"   # fields from KV: secret.<key>

    - name: Run Docker Compose
      ansible.builtin.command:
        cmd: docker compose -f confluence-compose.yml up -d
        chdir: "{{ project_dir }}"

    - name: Remove sensitive .env file
      ansible.builtin.file:
        path: "{{ project_dir }}/variables.env"
        state: absent
